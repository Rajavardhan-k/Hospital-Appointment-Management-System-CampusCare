<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hospital Appointment Management System – CampusCare Edition</h1>
    <p>Patient Registration Module</p>
  </header>

  <section class="form-section">
    <h2>Register New Patient</h2>
    <form>
      <label>Full Name:</label><input type="text" name="name"><br>
      <label>Age:</label><input type="number" name="age"><br>
      <label>Gender:</label>
      <select name="gender">
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select><br>
      <label>Contact:</label><input type="text" name="contact"><br>
      <button type="submit">Register</button>
    </form>
  </section>
</body>
</html>
