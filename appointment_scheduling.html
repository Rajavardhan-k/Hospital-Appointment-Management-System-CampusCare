<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointment Scheduling</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hospital Appointment Management System – CampusCare Edition</h1>
    <p>Appointment Scheduling Module</p>
  </header>

  <section class="form-section">
    <h2>Schedule Appointment</h2>
    <form>
      <label>Patient Name:</label><input type="text" name="patient"><br>
      <label>Doctor:</label><input type="text" name="doctor"><br>
      <label>Date:</label><input type="date" name="date"><br>
      <label>Time:</label><input type="time" name="time"><br>
      <button type="submit">Schedule</button>
    </form>
  </section>
</body>
</html>
